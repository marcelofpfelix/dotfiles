---
- name: Define optional private secret loader path
  ansible.builtin.set_fact:
    homelab_private_secret_loader_path: "{{ playbook_dir }}/../tasks/load-secrets.yml"

- name: Inspect optional private secret loader
  ansible.builtin.stat:
    path: "{{ homelab_private_secret_loader_path }}"
  delegate_to: localhost
  become: false
  register: homelab_private_secret_loader
  changed_when: false

- name: Load optional private secrets
  ansible.builtin.include_tasks: "{{ homelab_private_secret_loader_path }}"
  when: homelab_private_secret_loader.stat.exists
