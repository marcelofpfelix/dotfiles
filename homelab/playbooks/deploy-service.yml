- name: Deploy {{ deploy_service_name }}
  hosts: "{{ target | default('mac') }}"
  become: "{{ deploy_become | default(false) }}"
  pre_tasks:
    - name: Validate service selector
      ansible.builtin.assert:
        that:
          - deploy_service_name is defined
          - deploy_service_name is string
          - deploy_service_name | length > 0
        fail_msg: "Set deploy_service_name to a vars/services/<service>.yml name"

    - name: Include service vars {{ deploy_service_name }}
      ansible.builtin.include_vars:
        file: "../vars/services/{{ deploy_service_name }}.yml"

    - name: Inspect local service runtime bundle
      ansible.builtin.stat:
        path: "{{ service_runtime_bundle_dir }}"
      register: service_runtime_bundle
      when: service_runtime_bundle_files is defined

    - name: Create local service runtime bundle
      ansible.builtin.file:
        path: "{{ service_runtime_bundle_dir }}"
        state: directory
        mode: "0755"
      when: service_runtime_bundle_files is defined

    - name: Deploy local service runtime bundle
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ service_runtime_bundle_dir }}/{{ item.dest }}"
        remote_src: true
        mode: "{{ item.mode }}"
      loop: "{{ service_runtime_bundle_files | default([]) }}"
      when:
        - service_runtime_bundle_files is defined
        - not ansible_check_mode or service_runtime_bundle.stat.isdir | default(false)

  tasks:
    - name: Include deploy service role
      ansible.builtin.include_role:
        name: "{{ deploy_service_role | default('marcelofpfelix.homelab.service') }}"
