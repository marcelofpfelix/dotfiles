name: homelab

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    env:
      ANSIBLE_VAULT_PASSWORD_FILE: .vault_pass
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homelab
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: homelab/.python-version

      - name: Install uv
        run: python -m pip install uv

      - name: Prepare Ansible
        run: |
          printf '%s\n' ci > .vault_pass
          chmod 600 .vault_pass
          for attempt in 1 2 3; do
            uv run --extra dev ansible-galaxy collection install \
              -r collections/requirements.yml \
              -p collections && break
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Run Homelab checks
        run: make check
