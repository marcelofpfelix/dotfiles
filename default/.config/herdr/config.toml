# herdr configuration
# Mirrors desktop/.tmux.conf where Herdr has an equivalent concept.

onboarding = false

[theme]
name = "catppuccin"

[terminal]
new_cwd = "follow"

[update]
channel = "stable"
version_check = false
manifest_check = false

[keys]
prefix = "ctrl+a"

# tmux-like reload/help/session controls.
help = "prefix+?"
reload_config = "prefix+r"
workspace_picker = "prefix+s"
rename_workspace = "prefix+shift+w"
previous_workspace = "prefix+left"
next_workspace = "prefix+right"
switch_workspace = "prefix+shift+1..9"

# tmux windows map to Herdr tabs.
new_tab = "prefix+c"
rename_tab = "prefix+comma"
previous_tab = "prefix+p"
next_tab = "prefix+n"
move_tab_previous = "prefix+alt+left"
move_tab_next = "prefix+alt+right"
switch_tab = "prefix+1..9"
close_tab = "prefix+ampersand"
edit_scrollback = "prefix+e"

# tmux pane navigation and copy-mode muscle memory.
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
split_vertical = "prefix+percent"
split_horizontal = "prefix+double_quote"
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+shift+r"
resize_pane_left = "prefix+shift+left"
resize_pane_down = "prefix+shift+down"
resize_pane_up = "prefix+shift+up"
resize_pane_right = "prefix+shift+right"
toggle_sidebar = "prefix+b"

# Agent panes.
focus_agent = "prefix+alt+1..9"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "sessionizer.open"
description = "open project workspace"

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "sessionizer.worktree-open"
description = "open worktree workspace"

[ui]
mouse_capture = true
pane_borders = true
pane_outer_borders = false
pane_gaps = false
pane_scrollbars = false
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
status_indicators = "symbols"
accent = "#cba6f7"
confirm_close = true
prompt_new_tab_name = false
tab_bar_position = "top"
tab_bar_right = [
  { type = "command", command = "PATH=/opt/homebrew/bin:$HOME/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin board render --format terminal --surface tmux-top --color never", interval_seconds = 30, timeout_seconds = 10 },
  { type = "zoom" },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "
window_title = "{hostname}: {workspace} · {tab}"

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[ui.sound]
enabled = false

[session]
resume_agents_on_restore = true

[experimental]
kitty_graphics = true
pane_history = false
