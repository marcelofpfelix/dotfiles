id = "local.script-status"
name = "Script Status"
version = "0.1.0"
min_herdr_version = "0.7.5"
description = "Report script output as Herdr sidebar metadata tokens"
platforms = ["macos", "linux"]

[[startup]]
command = ["sh", "scripts/start.sh"]

[[actions]]
id = "restart"
title = "Restart script status"
contexts = ["global"]
command = ["sh", "scripts/start.sh", "restart"]

[[actions]]
id = "stop"
title = "Stop script status"
contexts = ["global"]
command = ["sh", "scripts/stop.sh"]
