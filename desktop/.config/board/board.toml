[[check]]
name = "scripts"
label = "Scripts"
kind = "native-script-status"
interval = "10s"
timeout = "2s"
fresh_for = "30s"

[[check]]
name = "alerts"
label = "Alerts"
kind = "native-alertmanager"
filters = ['squad="telephony.proxy.squad"']
critical_destination = "incidentio"
warning_destination = "slack"
excluded_channel = "#term-vendor-alerts"
interval = "10s"
timeout = "2s"
fresh_for = "30s"

[[check]]
name = "time"
label = "Clock"
kind = "native-time-offset"
interval = "10s"
timeout = "2s"
fresh_for = "30s"

[[check]]
name = "resolv"
label = "DNS"
kind = "native-resolv"
interval = "15s"
timeout = "2s"
fresh_for = "45s"

[[check]]
name = "safe"
label = "Safe"
kind = "native-safe"
interval = "30s"
timeout = "2s"
fresh_for = "90s"


[[check]]
name = "gpg"
label = "GPG"
kind = "command"
command = ["check-gpg"]
interval = "30s"
timeout = "2s"
fresh_for = "90s"

[[check]]
name = "docker"
label = "Docker"
kind = "native-docker"
interval = "30s"
timeout = "2s"
fresh_for = "90s"

[[check]]
name = "cpu"
label = "CPU"
kind = "native-cpu"
warning = 60
critical = 85
interval = "5s"
fresh_for = "15s"

[[check]]
name = "mem"
label = "Memory"
kind = "native-mem"
warning = 60
critical = 85
interval = "10s"
fresh_for = "30s"

[[check]]
name = "temp"
label = "Temp"
kind = "native-temp"
warning = 60
critical = 80
interval = "30s"
fresh_for = "90s"


[[check]]
name = "weather"
label = "Weather"
kind = "native-weather"
location = "Palmela, Portugal"
enabled = false
interval = "15m"
timeout = "3s"
fresh_for = "30m"

[[check]]
name = "time-panel"
label = "Time"
kind = "native-time-panel"
timezones = [
  { label = "Lisbon", zone = "Europe/Lisbon" },
  { label = "UTC", zone = "UTC" },
  { label = "New York", zone = "America/New_York" },
  { label = "SF", zone = "America/Los_Angeles" },
]
interval = "1s"
fresh_for = "3s"

[[check]]
name = "todo-panel"
label = "Todo"
kind = "native-todo-panel"
interval = "60s"
timeout = "2s"
fresh_for = "3m"

[actions.personal.refresh]
label = "Refresh"
command = ["board", "once"]
confirm = false
timeout = "10s"

[[surface]]
name = "quickshell-bar"
checks = ["scripts", "alerts", "time", "resolv", "safe", "gpg", "docker", "cpu", "mem", "temp", "weather"]

[[surface]]
name = "tmux-top"
checks = ["gpg", "docker", "cpu", "mem"]

[[surface]]
name = "quickshell-panels"
checks = ["time-panel", "todo-panel"]

[[surface]]
name = "personal.today"
checks = ["todo-panel"]

[[surface]]
name = "personal.money"
checks = []

[[surface]]
name = "personal.health"
checks = []

[[surface]]
name = "personal.habits"
checks = ["todo-panel"]

[[surface]]
name = "quickshell-weather"
checks = ["weather"]

[[surface]]
name = "quickshell-time-panel"
checks = ["time-panel"]

[[surface]]
name = "quickshell-todo-panel"
checks = ["todo-panel"]
